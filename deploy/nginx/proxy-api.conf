# Settings for every hop that talks to the calculator service (the internal API
# hop and the probes), so they cannot drift apart.
proxy_http_version 1.1;
# No upstream keepalive: each request uses its own connection, so a POST is never
# sent on a connection the service is closing.
proxy_set_header Connection "close";
proxy_set_header Host $upstream_host;
proxy_set_header X-Request-ID $correlation_id;
proxy_connect_timeout 2s;
proxy_send_timeout 10s;
proxy_read_timeout 10s;
# A failed request is never retried (POSTs included).
proxy_next_upstream off;
# The service never steers nginx: internal redirects and buffering hints ignored.
proxy_ignore_headers X-Accel-Redirect X-Accel-Expires X-Accel-Limit-Rate X-Accel-Buffering X-Accel-Charset;
