# Headers the edge owns (RNF-SEC-03, RF-API-07). Included in every location:
# nginx drops inherited add_header directives in any location that defines its
# own. `always` keeps them on error responses. The upstream copies are hidden so
# each header has exactly one value; headers the edge does not own
# (Cache-Control, Cross-Origin-Resource-Policy, Allow) pass through unchanged.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Request-ID $correlation_id always;

proxy_hide_header Content-Security-Policy;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
proxy_hide_header Cross-Origin-Opener-Policy;
proxy_hide_header X-Request-ID;
